<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | CampusPlus</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/user_style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<script>
function togglePass(inputId, icon) {
    const input = document.getElementById(inputId);
    if (input.type === "password") {
        input.type = "text";
        icon.textContent = "🙈";
    } else {
        input.type = "password";
        icon.textContent = "👁️";
    }
}
</script>
<body class="auth-page">
    <div class="auth-card">
        <div class="login-icon">🎓</div>
        <h2>Welcome Back</h2>
        <p class="login-subtitle">MIT-WPU Campus Network</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash-msg {% if category == 'success' %}msg-success{% else %}msg-danger{% endif %}">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <input type="email" name="u_email" placeholder="yourname@mitwpu.edu.in"
                   required class="input-field" autocomplete="email">
            <div class="pass-wrap">
                <input type="password" name="u_pass" placeholder="Password"
                       required class="input-field with-toggle" autocomplete="current-password"
                       id="loginPass">
                <span onclick="togglePass('loginPass', this)" class="pass-toggle">👁️</span>
            </div>
            <button type="submit" class="btn-primary" id="loginSubmit">
                Log In
            </button>
        </form>

        <p class="signup-prompt">
            Don't have an account?
            <a href="/signup">Sign up</a>
        </p>
    </div>
</body>
</html>
